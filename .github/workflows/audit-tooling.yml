name: Audit tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-audit.txt
      - run: ruff format --check scripts tests
      - run: ruff check scripts tests
      - run: pytest -q
