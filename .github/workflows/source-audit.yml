name: Auditoria da fonte oficial

on:
  push:
    paths:
      - ".github/workflows/source-audit.yml"
      - "scripts/validate_official_data.py"
      - "scripts/validate_pbix_structure.py"
      - "scripts/validate_semantic_model.py"
      - "requirements-audit.txt"
  pull_request:
    paths:
      - ".github/workflows/source-audit.yml"
      - "scripts/validate_official_data.py"
      - "scripts/validate_pbix_structure.py"
      - "scripts/validate_semantic_model.py"
      - "requirements-audit.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python scripts/validate_official_data.py
      - run: python scripts/validate_pbix_structure.py
      - run: python scripts/validate_semantic_model.py
