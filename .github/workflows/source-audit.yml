name: Auditoria da fonte oficial

on:
  push:
    paths:
      - ".github/workflows/source-audit.yml"
      - "scripts/inspect_official_workbooks.py"
      - "scripts/calculate_official_metrics.py"
      - "requirements-audit.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python scripts/calculate_official_metrics.py
