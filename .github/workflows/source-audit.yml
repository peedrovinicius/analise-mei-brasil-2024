name: Auditoria de dados e Power BI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-audit.yml"
      - "scripts/validate_official_data.py"
      - "scripts/validate_pbix_structure.py"
      - "scripts/validate_semantic_model.py"
      - "requirements-audit.txt"
      - "dashboards/**"
      - "dax/**"
  pull_request:
    paths:
      - ".github/workflows/source-audit.yml"
      - "scripts/validate_official_data.py"
      - "scripts/validate_pbix_structure.py"
      - "scripts/validate_semantic_model.py"
      - "requirements-audit.txt"
      - "dashboards/**"
      - "dax/**"
  schedule:
    - cron: "17 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-artifacts:
    name: Validar PBIX e modelo semântico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python scripts/validate_pbix_structure.py
      - run: python scripts/validate_semantic_model.py

  validate-source:
    name: Validar fonte oficial ao vivo
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python scripts/validate_official_data.py
