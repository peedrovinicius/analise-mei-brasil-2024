name: Propor melhoria
description: Sugira uma melhoria técnica, analítica ou de documentação.
title: "[Melhoria] "
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivação
      description: Qual problema ou oportunidade esta proposta atende?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo sugerido
      description: Descreva uma solução objetiva e delimitada.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área principal
      options:
        - Fonte e auditoria
        - Power Query
        - DAX
        - Dashboard
        - Documentação
        - Qualidade dos dados
    validations:
      required: true
  - type: textarea
    id: methodology
    attributes:
      label: Impacto metodológico
      description: Informe se a proposta altera universo, indicador, ranking, fonte ou interpretação.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribuição
      options:
        - label: Tenho interesse em implementar esta melhoria.
